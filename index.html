<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Your Class</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .booking-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border: 1px solid var(--border-color);
    }

    .booking-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .booking-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .booking-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text-main);
      background-color: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="booking-card">
    <div class="booking-header">
      <h1>Book Your Class</h1>
      <p>Reserve your spot online today</p>
    </div>

    <form id="bookingForm">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required />
      </div>

      <div class="form-group">
        <label for="passType">Select Option</label>
        <select id="passType" name="passType" required>
          <option value="First Class - £8" selected>First Class - £8</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">BOOK HERE</button>
    </form>
  </div>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const passType = document.getElementById('passType').value;

      // STRIPE CHECKOUT REDIRECTS FOR ALL PAID OPTIONS
      const stripeLinks = {
        'First Class - £8': 'https://buy.stripe.com/cNifZj8TH0LC2M3gH27N603'
      };

      const targetUrl = stripeLinks[passType];

      if (targetUrl) {
        // Direct page redirect optimized for Desktop and Mobile
        window.location.assign(`${targetUrl}?prefilled_email=${encodeURIComponent(email)}`);
      } else {
        alert('Please select a valid payment option.');
      }
    });
  </script>

</body>
</html>
